<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>真实帅哥</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			color: #fff;
			font-family: "Microsoft YaHei", sans-serif;
			background: linear-gradient(135deg, #111827, #4b5563);
		}
		.card {
			width: min(420px, 100%);
			overflow: hidden;
			border-radius: 22px;
			background: rgba(17, 24, 39, .82);
			box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
		}
		.portrait {
			width: 100%;
			height: 560px;
			object-fit: cover;
			object-position: center top;
			display: block;
		}
		.info { padding: 22px 24px 26px; }
		h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; }
		p { margin: 0; color: #cbd5e1; line-height: 1.7; }
		.tag {
			display: inline-block;
			margin-top: 16px;
			padding: 6px 12px;
			border: 1px solid #64748b;
			border-radius: 999px;
			color: #e2e8f0;
			font-size: 13px;
		}
	</style>
</head>
<body>
	<main class="card">
		<img class="portrait" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=90" alt="一位真实、帅气的年轻男性肖像">
		<section class="info">
			<h1>真实感肖像</h1>
			<p>自然光下的真实帅哥，五官立体，气质沉稳，整体呈现接近人类摄影的自然效果。</p>
			<span class="tag">写实摄影 · 非卡通</span>
		</section>
	</main>
</body>
</html>
