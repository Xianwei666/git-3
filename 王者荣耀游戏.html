<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>峡谷对决</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091523;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}#wrap{height:100vh;display:grid;place-items:center}#game{position:relative;width:min(100vw,1100px);height:min(100vh,680px);background:#163f39;overflow:hidden;box-shadow:0 0 35px #000}canvas{display:block;width:100%;height:100%;background:#27704e}.hud{position:absolute;inset:0;pointer-events:none}.top{height:58px;background:#071321d9;display:flex;align-items:center;justify-content:center;gap:35px;font-size:14px}.bar{width:165px;height:9px;background:#263343;border-radius:8px;overflow:hidden;margin-top:3px}.hp{height:100%;background:#39df77}.gold{color:#ffd65a}.tip{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#06111bc8;padding:8px 15px;border-radius:18px}.skill{position:absolute;right:22px;bottom:24px;display:flex;gap:12px;align-items:end}.key{width:58px;height:58px;border:2px solid #97c9e4;border-radius:50%;background:#182f49e8;display:grid;place-items:center;font-size:21px;box-shadow:0 0 12px #3b91d4}.key small{font-size:11px;position:absolute;margin-top:78px;color:#b9d7e8}.cool{opacity:.45}.joy{position:absolute;left:26px;bottom:26px;width:125px;height:125px;border-radius:50%;background:#172c3d99;border:2px solid #7c9eb0;pointer-events:auto}.stick{position:absolute;width:50px;height:50px;left:35px;top:35px;border-radius:50%;background:#77b5ce;opacity:.85}.msg{position:absolute;left:18px;bottom:15px;color:#d8f4ff;font-size:13px}.end{position:absolute;inset:0;display:none;background:#06101bcc;place-items:center;text-align:center}.end h1{font-size:44px;color:#ffd458}.end button{padding:12px 28px;border:0;border-radius:8px;background:#e6ac38;color:#211500;font-size:16px}
</style></head><body><div id="wrap"><div id="game"><canvas id="c" width="1100" height="680"></canvas><div class="hud"><div class="top"><div>我方 <span id="score">0</span> 击败</div><div>水晶战场　<span class="gold">◆ <b id="money">300</b></span></div><div>敌方 <span id="escore">0</span> 击败</div></div><div class="tip">WASD移动　鼠标左键普通攻击　Q技能　E闪现</div><div class="joy"><div class="stick"></div></div><div class="skill"><div class="key" id="q">✦<small>Q 火球</small></div><div class="key" id="e">➤<small>E 闪现</small></div></div><div class="msg" id="msg">摧毁敌方核心，赢得胜利！</div></div><div class="end" id="end"><div><h1 id="result"></h1><button onclick="location.reload()">再来一局</button></div></div></div></div>
<script>
const C=document.querySelector('canvas'),x=C.getContext('2d'),W=1100,H=680;let keys={},shots=[],particles=[],over=false,last=0,score=0,escore=0,money=300;
const hero={x:190,y:340,r:19,hp:100,max:100,spd:230,cd:0,flash:0};
const core={x:1015,y:340,hp:500,max:500};let enemies=[],minions=[];
for(let i=0;i<5;i++)enemies.push({x:770+i%2*70,y:210+i*65,r:18,hp:55,max:55,cd:Math.random()*2});
const towers=[{x:300,y:170,hp:250,team:1},{x:800,y:510,hp:250,team:2}];
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='q')fire(true);if(e.key.toLowerCase()==='e')flash()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);C.addEventListener('click',e=>{if(!over)fire(false)});
function fire(skill){if(skill&&hero.cd>0)return;let a=Math.atan2((Math.random()-.5)*.35,1),d=skill?560:410;shots.push({x:hero.x+20,y:hero.y,vx:Math.cos(a)*d,vy:Math.sin(a)*d,team:1,r:skill?11:6,power:skill?35:18});if(skill){hero.cd=5;document.getElementById('q').classList.add('cool');setTimeout(()=>document.getElementById('q').classList.remove('cool'),5000)}}
function flash(){if(hero.flash>0)return;hero.x=Math.min(650,hero.x+150);hero.flash=7;document.getElementById('e').classList.add('cool');setTimeout(()=>document.getElementById('e').classList.remove('cool'),7000)}
function spawn(){minions.push({x:235,y:300+Math.random()*80,v:1,hp:30});}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}
function update(dt){if(over)return;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(dx,dy)||1;hero.x=Math.max(50,Math.min(1040,hero.x+dx/l*hero.spd*dt));hero.y=Math.max(80,Math.min(630,hero.y+dy/l*hero.spd*dt));hero.cd=Math.max(0,hero.cd-dt);hero.flash=Math.max(0,hero.flash-dt);if(Math.random()<dt*.35)spawn();
 shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;enemies.forEach(e=>{if(e.hp>0&&s.team===1&&hit(s,e)){e.hp-=s.power;s.x=-99;if(e.hp<=0){escore++;money+=50;burst(e.x,e.y,'#ffbd55')}}});if(hit(s,core)&&s.team===1){core.hp-=s.power;s.x=-99}});shots=shots.filter(s=>s.x>-20&&s.x<W+20&&s.y>60&&s.y<H);
 enemies.forEach(e=>{if(e.hp<=0)return;let a=Math.atan2(hero.y-e.y,hero.x-e.x);if(Math.hypot(hero.x-e.x,hero.y-e.y)>150){e.x+=Math.cos(a)*35*dt;e.y+=Math.sin(a)*35*dt}else{e.cd-=dt;if(e.cd<0){hero.hp-=8;e.cd=1.2;burst(hero.x,hero.y,'#e65c5c')}}});minions.forEach(m=>{m.x+=55*dt;if(m.x>core.x-40){core.hp-=6*dt;m.x=-20}});minions=minions.filter(m=>m.x>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(hero.hp<=0)finish(false);if(core.hp<=0)finish(true);document.getElementById('score').textContent=score;document.getElementById('escore').textContent=escore;document.getElementById('money').textContent=money}
function burst(x,y,col){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,life:.5,col})}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#27704e';x.fillRect(0,0,W,H);x.strokeStyle='#419464';x.lineWidth=55;x.beginPath();x.moveTo(50,520);x.lineTo(1050,160);x.stroke();x.strokeStyle='#7cbd70';x.lineWidth=3;x.setLineDash([12,12]);x.beginPath();x.moveTo(50,520);x.lineTo(1050,160);x.stroke();x.setLineDash([]);[...towers,{...core,r:30}].forEach(t=>{x.fillStyle=t.team===1?'#35a9e8':'#d54e69';x.beginPath();x.arc(t.x,t.y,t.r||22,0,7);x.fill();x.fillStyle='#222';x.fillRect(t.x-25,t.y-(t.r||22)-13,50,5);x.fillStyle='#56df78';x.fillRect(t.x-25,t.y-(t.r||22)-13,50*(t.hp/t.max),5)});minions.forEach(m=>unit(m,'#70d7e8'));enemies.forEach(e=>e.hp>0&&unit(e,'#e35d70'));unit(hero,'#ffd15c');shots.forEach(s=>{x.fillStyle='#ffe78a';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});particles.forEach(p=>{x.fillStyle=p.col;x.globalAlpha=Math.max(0,p.life*2);x.fillRect(p.x,p.y,4,4);x.globalAlpha=1});}
function unit(u,col){x.fillStyle=col;x.beginPath();x.arc(u.x,u.y,u.r,0,7);x.fill();x.fillStyle='#18222b';x.fillRect(u.x-20,u.y-u.r-10,40,4);x.fillStyle='#52e47a';x.fillRect(u.x-20,u.y-u.r-10,40*Math.max(0,u.hp/u.max),4)}
function finish(win){over=true;document.getElementById('result').textContent=win?'胜利！':'失败';document.getElementById('end').style.display='grid'}function loop(t){update((t-last)/1000||0);last=t;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
